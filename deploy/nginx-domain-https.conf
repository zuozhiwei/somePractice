map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://s.somecoder.cn$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_certificate /etc/letsencrypt/live/82.156.151.237/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/82.156.151.237/privkey.pem;
    return 301 https://s.somecoder.cn$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name s.somecoder.cn;
    ssl_certificate /etc/letsencrypt/live/s.somecoder.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s.somecoder.cn/privkey.pem;
    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
